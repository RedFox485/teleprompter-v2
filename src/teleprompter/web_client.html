<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a1a2e">
<title>Teleprompter</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0d0d1a; --fg: #e8e8f0; --chord: #00ffff; --section: #ff00ff;
  --muted: #666; --accent: #00ff88; --danger: #ff4444;
  --card: #16162a; --border: #2a2a4a;
}
[data-theme="light"] { --bg: #f8f8ff; --fg: #1a1a2e; --chord: #0066cc; --section: #cc00cc; --muted: #888; --card: #fff; --border: #ddd; }
body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro", system-ui, sans-serif; background: var(--bg); color: var(--fg); min-height: 100vh; display: flex; flex-direction: column; overflow: hidden; -webkit-tap-highlight-color: transparent; }
header { position: sticky; top: 0; z-index: 100; background: var(--bg); border-bottom: 1px solid var(--border); padding: 8px 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
header h1 { font-size: 16px; font-weight: 600; flex: 1; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.status { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--card); color: var(--muted); display: flex; align-items: center; gap: 4px; }
.status.connected { color: var(--accent); }
.status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
.status.connected::before { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
.btn { appearance: none; border: 1px solid var(--border); background: var(--card); color: var(--fg); padding: 6px 10px; border-radius: 6px; font-size: 13px; cursor: pointer; touch-action: manipulation; }
.btn:active { background: var(--border); }
.btn.primary { border-color: var(--accent); color: var(--accent); }
.btn.danger { border-color: var(--danger); color: var(--danger); }
main { flex: 1; overflow-y: auto; padding: 12px; padding-bottom: 100px; }
.song-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; font-size: 13px; color: var(--muted); }
.song-meta span { background: var(--card); padding: 4px 10px; border-radius: 999px; border: 1px solid var(--border); }
.song-meta .key { color: var(--chord); }
.song-meta .tempo { color: var(--accent); }
.lyrics { font-size: 20px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
.lyrics .section { color: var(--section); font-weight: 600; font-size: 18px; margin: 16px 0 8px; }
.lyrics .line { display: flex; flex-direction: column; gap: 2px; }
.lyrics .chords { color: var(--chord); font-size: 14px; letter-spacing: 0.5px; font-family: "SF Mono", monospace; }
.lyrics .text { }
.lyrics .chord-inline { color: var(--chord); background: rgba(0,255,255,0.1); padding: 0 2px; border-radius: 3px; font-family: "SF Mono", monospace; font-size: 0.9em; }
.flash-overlay { position: fixed; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(circle at center, var(--accent) 0%, transparent 70%); transition: opacity 0ms; z-index: 200; }
.flash-overlay.active { opacity: 0.3; transition: opacity 50ms; }
footer { position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg); border-top: 1px solid var(--border); padding: 8px 12px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
footer .btn { flex: 1; max-width: 140px; text-align: center; }
footer .btn.playing { border-color: var(--accent); color: var(--accent); background: rgba(0,255,136,0.1); }
footer .btn.paused { border-color: var(--warning); color: var(--warning); background: rgba(255,200,0,0.1); }
footer .btn.stopped { border-color: var(--danger); color: var(--danger); background: rgba(255,68,68,0.1); }
#searchPanel { position: fixed; bottom: 60px; left: 12px; right: 12px; background: var(--card); border: 1px solid var(--border); border-radius: 12px 12px 0 0; padding: 12px; transform: translateY(100%); transition: transform 0.2s; z-index: 50; max-height: 60vh; overflow-y: auto; }
#searchPanel.open { transform: translateY(0); }
#searchInput { width: 100%; padding: 12px; font-size: 18px; border: 1px solid var(--border); background: var(--bg); color: var(--fg); border-radius: 8px; margin-bottom: 8px; }
.search-results { display: flex; flex-direction: column; gap: 6px; }
.search-item { display: flex; align-items: center; gap: 10px; padding: 10px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; }
.search-item .info { flex: 1; min-width: 0; }
.search-item .title { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.search-item .meta { font-size: 12px; color: var(--muted); display: flex; gap: 10px; }
.search-item .btn { padding: 6px 12px; font-size: 13px; }
.setlist-panel { position: fixed; top: 56px; left: 0; right: 0; bottom: 60px; background: var(--bg); border-top: 1px solid var(--border); padding: 12px; overflow-y: auto; z-index: 40; display: none; }
.setlist-panel.open { display: block; }
.setlist-item { display: flex; align-items: center; gap: 10px; padding: 12px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; }
.setlist-item.current { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.setlist-item .num { width: 28px; text-align: center; color: var(--muted); font-weight: 600; }
.setlist-item .info { flex: 1; min-width: 0; }
.setlist-item .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.setlist-item .meta { font-size: 12px; color: var(--muted); display: flex; gap: 8px; }
.setlist-item .actions { display: flex; gap: 4px; }
.live-panel { position: fixed; bottom: 60px; left: 12px; right: 12px; background: var(--card); border: 1px solid var(--border); border-radius: 12px 12px 0 0; padding: 12px; transform: translateY(100%); transition: transform 0.2s; z-index: 50; max-height: 60vh; overflow-y: auto; }
.live-panel.open { transform: translateY(0); }
.live-panel h3 { margin-bottom: 10px; color: var(--accent); font-size: 14px; }
.live-section { display: flex; align-items: center; gap: 8px; padding: 10px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; }
.live-section.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.live-section .name { flex: 1; font-weight: 600; }
.live-section .progress { width: 60px; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
.live-section .progress-bar { height: 100%; background: var(--accent); transition: width 0.1s; }
.live-section .actions { display: flex; gap: 4px; }
.live-section .action-btn { padding: 4px 8px; font-size: 11px; }
.live-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
.live-actions .btn { flex: 1; min-width: 80px; font-size: 12px; padding: 8px 6px; }
@media (max-width: 480px) { .lyrics { font-size: 18px; } footer .btn { max-width: none; flex: 1; } }
</style>
</head>
<body>
<header>
  <div class="status" id="status">Disconnected</div>
  <h1 id="songTitle">Teleprompter</h1>
  <button class="btn" id="btnSetlist">📋</button>
</header>
<main id="main">
  <div class="song-meta" id="songMeta"></div>
  <div class="lyrics" id="lyrics">Connecting…</div>
</main>
<div class="flash-overlay" id="flash"></div>
<footer>
  <button class="btn" id="btnPrev">⏮</button>
  <button class="btn primary stopped" id="btnPlayPause">▶ Play</button>
  <button class="btn danger" id="btnStop">⏹ Stop</button>
  <button class="btn" id="btnNext">⏭</button>
  <button class="btn" id="btnTap">TAP</button>
  <button class="btn" id="btnSearch">🔍</button>
  <button class="btn" id="btnTransposeDown">♭</button>
  <button class="btn" id="btnTransposeUp">♯</button>
  <button class="btn" id="btnLive">🎵 Live</button>
</footer>
<div id="searchPanel">
  <input type="search" id="searchInput" placeholder="Search: G, Em, 120bpm, 90-110, artist, title…" autocapitalize="off" autocorrect="off" spellcheck="false">
  <div class="search-results" id="searchResults"></div>
</div>
<div class="setlist-panel" id="setlistPanel"></div>
<div class="live-panel" id="livePanel"></div>
<script>
(function() {
  const WS_URL = `ws://${location.host}/ws`;
  let ws = null;
  let reconnectTimer = null;
  let beatSchedule = [];
  let beatIndex = 0;
  let flashTimer = null;
  let nextBeatTimeout = null;
  let serverTimeOffset = 0;
  let currentSong = null;
  let currentSetlist = [];
  let currentSongIndex = 0;
  let autoScroll = true;
  let scrollPosition = 0;
  let currentTranspose = 0;
  let currentBpm = 0;
  let midiConnected = false;
  let playState = "stopped"; // stopped, playing, paused
  let isSearchOpen = false;
  let isSetlistOpen = false;
  let isLiveOpen = false;
  let liveStatus = null;
  let lyricsScrollRaf = null;
  let lastScrollPosition = 0;
  
  const $ = (s) => document.querySelector(s);
  const $$ = (s) => document.querySelectorAll(s);
  
  function connect() {
    if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;
    ws = new WebSocket(WS_URL);
    ws.binaryType = "arraybuffer";
    
    ws.onopen = () => {
      updateStatus(true);
      clearTimeout(reconnectTimer);
      send({type: "ping"});
    };
    
    ws.onclose = () => {
      updateStatus(false);
      reconnectTimer = setTimeout(connect, 2000);
    };
    
    ws.onerror = () => ws.close();
    
    ws.onmessage = (e) => handleMessage(JSON.parse(e.data));
  }
  
  function send(msg) { if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(msg)); }
  
  function handleMessage(msg) {
    switch (msg.type) {
      case "state": applyState(msg); break;
      case "scroll": setScrollPosition(msg.position); break;
      case "bpm": applyBpm(msg); break;
      case "setlist": currentSetlist = msg.setlist; renderSetlist(); break;
      case "searchResults": renderSearchResults(msg.results); break;
      case "liveStatus": liveStatus = msg; renderLivePanel(); break;
      case "pong": serverTimeOffset = msg.serverTime - performance.now() / 1000; break;
    }
  }
  
  function applyState(msg) {
    const wasPlaying = playState === "playing";
    currentSong = msg.song;
    currentSetlist = msg.setlist || [];
    currentSongIndex = msg.currentSongIndex ?? 0;
    autoScroll = msg.autoScroll ?? true;
    currentTranspose = msg.transpose ?? 0;
    currentBpm = msg.bpm ?? 0;
    midiConnected = msg.midiConnected ?? false;
    playState = msg.playState ?? "stopped";
    serverTimeOffset = (msg.serverTime || 0) - performance.now() / 1000;
    
    if (msg.scroll !== undefined) setScrollPosition(msg.scroll);
    renderSong();
    renderSetlist();
    updateTitle();
    updatePlayButton();
    
    if (playState === "playing" && !wasPlaying) scheduleBeats();
    else if (playState !== "playing") clearTimeout(nextBeatTimeout);
  }
  
  function applyBpm(msg) {
    currentBpm = msg.bpm ?? 0;
    beatSchedule = msg.nextBeats || [];
    beatIndex = 0;
    if (currentBpm > 0) scheduleBeats();
  }
  
  function scheduleBeats() {
    clearTimeout(nextBeatTimeout);
    if (beatIndex >= beatSchedule.length) return;
    const now = performance.now() / 1000 + serverTimeOffset;
    const delay = Math.max(0, (beatSchedule[beatIndex] - now) * 1000);
    nextBeatTimeout = setTimeout(() => {
      flashBeat();
      beatIndex++;
      scheduleBeats();
    }, delay);
  }
  
  function flashBeat() {
    const flash = $("#flash");
    flash.classList.add("active");
    clearTimeout(flashTimer);
    flashTimer = setTimeout(() => flash.classList.remove("active"), 80);
  }
  
  function renderSong() {
    const lyricsEl = $("#lyrics");
    const metaEl = $("#songMeta");
    if (!currentSong) {
      lyricsEl.textContent = "No song loaded";
      metaEl.innerHTML = "";
      return;
    }
    metaEl.innerHTML = `
      <span class="key">${currentSong.key || "—"}</span>
      <span class="tempo">${currentSong.tempo || "—"} BPM</span>
      ${currentSong.artist ? `<span>${escapeHtml(currentSong.artist)}</span>` : ""}
    `;
    let html = "";
    for (const section of currentSong.sections) {
      html += `<div class="section">${escapeHtml(section.name)}</div>`;
      for (const line of section.lines) {
        if (line.is_section_header) continue;
        html += '<div class="line">';
        if (line.chords && line.chords.length) {
          html += `<div class="chords">${renderChords(line.chords)}</div>`;
        }
        html += `<div class="text">${renderTextWithChords(line.text, line.chords)}</div>`;
        html += '</div>';
      }
    }
    lyricsEl.innerHTML = html;
    restoreScrollPosition();
  }
  
  function renderChords(chords) {
    return chords.map(c => `<span class="chord-inline">${escapeHtml(c)}</span>`).join(" ");
  }
  
  function renderTextWithChords(text, chords) {
    if (!chords || !chords.length) return escapeHtml(text);
    let result = "";
    let textIdx = 0;
    for (const chord of chords) {
      const pos = text.indexOf("[", textIdx);
      if (pos === -1) break;
      result += escapeHtml(text.slice(textIdx, pos));
      result += `<span class="chord-inline">${escapeHtml(chord)}</span>`;
      textIdx = text.indexOf("]", pos) + 1;
    }
    result += escapeHtml(text.slice(textIdx));
    return result;
  }
  
  function renderSetlist() {
    const panel = $("#setlistPanel");
    panel.innerHTML = currentSetlist.map((s, i) => `
      <div class="setlist-item ${i === currentSongIndex ? "current" : ""}" data-index="${i}">
        <span class="num">${i + 1}</span>
        <div class="info">
          <div class="title">${escapeHtml(s.title)}</div>
          <div class="meta">${escapeHtml(s.artist || "")} ${s.key ? "• " + escapeHtml(s.key) : ""} ${s.tempo ? "• " + s.tempo + " BPM" : ""}</div>
        </div>
        <div class="actions">
          <button class="btn" data-action="select" data-index="${i}">Select</button>
          <button class="btn danger" data-action="remove" data-index="${i}">✕</button>
        </div>
      </div>
    `).join("");
    panel.querySelectorAll("[data-action]").forEach(btn => {
      btn.onclick = (e) => {
        const action = e.target.dataset.action;
        const index = parseInt(e.target.dataset.index);
        if (action === "select") send({type: "selectSong", index});
        else if (action === "remove") send({type: "removeFromSetlist", index});
      };
    });
  }
  
  function renderSearchResults(results) {
    const el = $("#searchResults");
    if (!results.length) { el.innerHTML = '<div style="color:var(--muted);padding:10px;text-align:center">No results</div>'; return; }
    el.innerHTML = results.map(s => `
      <div class="search-item">
        <div class="info">
          <div class="title">${escapeHtml(s.title)}</div>
          <div class="meta">${escapeHtml(s.artist || "")} ${s.key ? "• " + escapeHtml(s.key) : ""} ${s.tempo ? "• " + s.tempo + " BPM" : ""}</div>
        </div>
        <button class="btn primary" data-id="${escapeHtml(s.id)}">Add</button>
      </div>
    `).join("");
    el.querySelectorAll("button").forEach(btn => btn.onclick = () => send({type: "addToSetlist", songId: btn.dataset.id}));
  }
  
  function setScrollPosition(pos) {
    scrollPosition = Math.max(0, Math.min(1, pos));
    const main = $("#main");
    const maxScroll = main.scrollHeight - main.clientHeight;
    main.scrollTop = scrollPosition * maxScroll;
    lastScrollPosition = main.scrollTop;
  }
  
  function restoreScrollPosition() {
    requestAnimationFrame(() => setScrollPosition(scrollPosition));
  }
  
  function updateTitle() {
    $("#songTitle").textContent = currentSong ? currentSong.title : "Teleprompter";
  }
  
  function updateStatus(connected) {
    const el = $("#status");
    el.textContent = connected ? "Connected" : "Disconnected";
    el.classList.toggle("connected", connected);
  }
  
  function escapeHtml(s) { return String(s).replace(/&/g,"&").replace(/</g,"<").replace(/>/g,">").replace(/"/g,"""); }
  
  function updatePlayButton() {
    const btn = $("#btnPlayPause");
    const stopBtn = $("#btnStop");
    btn.classList.remove("playing", "paused", "stopped");
    stopBtn.classList.remove("playing", "paused", "stopped");
    if (playState === "playing") {
      btn.textContent = "⏸ Pause";
      btn.classList.add("playing");
      stopBtn.classList.add("playing");
    } else if (playState === "paused") {
      btn.textContent = "▶ Resume";
      btn.classList.add("paused");
      stopBtn.classList.add("paused");
    } else {
      btn.textContent = "▶ Play";
      btn.classList.add("stopped");
      stopBtn.classList.add("stopped");
    }
  }
  
  function renderLivePanel() {
    if (!liveStatus) return;
    const panel = $("#livePanel");
    let html = `<h3>${liveStatus.title} - ${liveStatus.artist} (${liveStatus.tempo} BPM)</h3>`;
    html += '<div class="live-sections">';
    liveStatus.sections.forEach((s, i) => {
      const isActive = i === liveStatus.current_section_index;
      html += `
        <div class="live-section ${isActive ? 'active' : ''}" style="border-left: 4px solid ${s.color}">
          <span class="name">${s.name} ${s.is_extended ? '⟳' : ''} ${s.repeats > 1 ? `×${s.repeats}` : ''}</span>
          <div class="progress"><div class="progress-bar" style="width: ${Math.round(s.section_progress * 100)}%"></div></div>
          <div class="actions">
            ${s.repeats < s.max_repeats ? `<button class="btn action-btn" data-action="extend" data-index="${i}">+1</button>` : ''}
            ${i > liveStatus.current_section_index ? `<button class="btn action-btn" data-action="skip" data-index="${i}">→</button>` : ''}
          </div>
        </div>
      `;
    });
    html += '</div>';
    html += '<div class="live-actions">';
    html += '<button class="btn" data-action="add_chorus">+ Chorus</button>';
    html += '<button class="btn" data-action="add_verse">+ Verse</button>';
    html += '<button class="btn" data-action="add_bridge">+ Bridge</button>';
    html += '<button class="btn" data-action="add_solo">+ Solo</button>';
    html += '<button class="btn danger" data-action="end_song">End Song</button>';
    html += '</div>';
    panel.innerHTML = html;
    
    // Attach action handlers
    panel.querySelectorAll('[data-action]').forEach(btn => {
      btn.onclick = () => {
        const action = btn.dataset.action;
        const index = parseInt(btn.dataset.index || -1);
        sendLiveAction(action, index);
      };
    });
  }
  
  function sendLiveAction(action, index = -1) {
    send({type: "liveAction", action: action, index: index});
    // Refresh status after action
    setTimeout(() => send({type: "getLiveStatus"}), 100);
  }
  
  // UI handlers
  $("#btnPlayPause").onclick = () => {
    if (playState === "playing") send({type: "pause"});
    else send({type: "play"});
  };
  $("#btnStop").onclick = () => send({type: "stop"});
  $("#btnTap").onclick = () => send({type: "tapTempo"});
  $("#btnPrev").onclick = () => send({type: "selectSong", index: Math.max(0, currentSongIndex - 1)});
  $("#btnNext").onclick = () => send({type: "selectSong", index: Math.min(currentSetlist.length - 1, currentSongIndex + 1)});
  $("#btnTransposeDown").onclick = () => send({type: "transpose", delta: -1});
  $("#btnTransposeUp").onclick = () => send({type: "transpose", delta: 1});
  $("#btnSearch").onclick = toggleSearch;
  $("#btnSetlist").onclick = toggleSetlist;
  $("#btnLive").onclick = toggleLive;
  
  function toggleLive() {
    isLiveOpen = !isLiveOpen;
    $("#livePanel").classList.toggle("open", isLiveOpen);
    if (isLiveOpen) {
      send({type: "getLiveStatus"});
    }
  }
  
  function toggleSearch() {
    isSearchOpen = !isSearchOpen;
    $("#searchPanel").classList.toggle("open", isSearchOpen);
    if (isSearchOpen) {
      $("#searchInput").focus();
      $("#searchInput").value = "";
      send({type: "search", query: ""});
    }
  }
  
  function toggleSetlist() {
    isSetlistOpen = !isSetlistOpen;
    $("#setlistPanel").classList.toggle("open", isSetlistOpen);
    $("#main").style.display = isSetlistOpen ? "none" : "block";
  }
  
  $("#searchInput").addEventListener("input", (e) => send({type: "search", query: e.target.value}));
  
  // Scroll handling - send position to server
  let scrollThrottle = 0;
  $("#main").addEventListener("scroll", () => {
    if (scrollThrottle) return;
    scrollThrottle = requestAnimationFrame(() => {
      const main = $("#main");
      const maxScroll = main.scrollHeight - main.clientHeight;
      if (maxScroll > 0) {
        scrollPosition = main.scrollTop / maxScroll;
        send({type: "scroll", position: scrollPosition});
      }
      scrollThrottle = 0;
    });
  }, {passive: true});
  
  // Prevent pull-to-refresh on iOS
  document.body.addEventListener("touchmove", (e) => {
    if (e.target.closest("#main")) return;
    e.preventDefault();
  }, {passive: false});
  
  // Wake lock for performance
  let wakeLock = null;
  async function requestWakeLock() {
    try { wakeLock = await navigator.wakeLock.request("screen"); }
    catch (e) {}
  }
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") requestWakeLock();
    else if (wakeLock) { wakeLock.release(); wakeLock = null; }
  });
  
  // Install PWA
  let deferredPrompt = null;
  window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); deferredPrompt = e; });
  
  connect();
  requestWakeLock();
  
  // Periodic ping
  setInterval(() => send({type: "ping"}), 15000);
})();
</script>
</body>
</html>
