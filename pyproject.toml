[project]
name = "teleprompter-v2"
version = "0.1.0"
description = "Band/Live Karaoke Teleprompter - standalone lyrics & chords display with BPM sync"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.70.0",
    "python-rtmidi>=1.5.0",
    "pydantic>=2.8.0",
    "pyyaml>=6.0.1",
    "watchdog>=4.0.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"
lint.select = ["E", "F", "I", "UP", "B", "C4", "SIM", "T20"]
lint.ignore = ["S101", "B011"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true